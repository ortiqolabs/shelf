## aria2 for Shelf - tuned for a Pi on an SD card
## API: http://127.0.0.1:6800/jsonrpc  (loopback only)

enable-rpc=true
rpc-listen-all=false
rpc-listen-port=6800
rpc-secret=__SECRET__
rpc-allow-origin-all=false

## where files land
dir=/media/Movies_and_Shows
continue=true
file-allocation=none
disk-cache=16M
max-concurrent-downloads=4
max-connection-per-server=8
split=8
min-split-size=4M
max-overall-download-limit=0
max-overall-upload-limit=1M

## torrents
bt-enable-lpd=true
bt-max-peers=60
bt-request-peer-speed-limit=200K
enable-dht=true
enable-peer-exchange=true
follow-torrent=true
seed-time=0
seed-ratio=0

## survive restarts
save-session=/home/arnav/.config/aria2/aria2.session
input-file=/home/arnav/.config/aria2/aria2.session
save-session-interval=30
force-save=true

## quiet on the console
summary-interval=0
console-log-level=warn
log=/home/arnav/.config/aria2/aria2.log
log-level=warn
